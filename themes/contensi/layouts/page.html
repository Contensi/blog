{{ define "main" }}
{{ partial "article.html" . }}
{{- if or .NextInSection .PrevInSection }}
<nav class="beitrag-nav">
  {{- with .NextInSection }}<a href="{{ .RelPermalink }}" rel="next">{{ T "newerPost" }}</a>{{ end }}
  {{- with .PrevInSection }}<a href="{{ .RelPermalink }}" rel="prev">{{ T "olderPost" }}</a>{{ end }}
</nav>
{{- end }}
{{ end }}
