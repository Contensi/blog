<dialog id="sucheDialog" class="such-dialog" data-index="{{ (site.Home.OutputFormats.Get "json").RelPermalink }}">
  <div class="such-kopf">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="search" id="sucheEingabe" placeholder="{{ T "searchPlaceholder" }}" autocomplete="off"
           aria-label="{{ T "searchTerm" }}">
    <button type="button" class="dlg-close" id="sucheSchliessen" aria-label="{{ T "close" }}">&times;</button>
  </div>
  <ul class="such-ergebnisse" id="sucheErgebnisse"></ul>
  <p class="such-leer" id="sucheLeer" hidden>{{ T "searchEmpty" }}</p>
</dialog>
