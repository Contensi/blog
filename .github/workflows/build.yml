name: build

on:
  pull_request:
  workflow_call:

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Build
        run: hugo --gc --minify
      - name: Check internal links
        run: python3 scripts/check_links.py public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
